# ------------------------------------
# Example PXE Config File
# ------------------------------------

[global]
# The IP of your TFTP/HTTP server
server_ip=192.168.1.100

# Where to place TFTP boot files
tftp_dir=./tftpboot

# Where to place other files for HTTP retrieval
http_dir=./httproot

# Directory for storing or caching ISOs
iso_dir=./isos

# ------------------------------------
# Arch Linux Config
# ------------------------------------
[arch]
label=Install Arch Linux
iso_url=https://geo.mirror.pkgbuild.com/iso/latest/archlinux.iso
iso_name=archlinux.iso
kernel_path=/arch/boot/x86_64/vmlinuz-linux
initrd_path=/arch/boot/x86_64/initramfs-linux.img

# The 'append' line typically includes kernel params
append=ip=dhcp

# Example of comma-separated values you might store as an array
archives_needed=arch/squashfs,arch/boot

# ------------------------------------
# Rocky Linux Config
# ------------------------------------
[rocky]
label=Install Rocky Linux
iso_url=https://dl.rockylinux.org/pub/rocky/9/isos/x86_64/
iso_name=Rocky-9.5-x86_64-boot.iso
kernel_path=/images/pxeboot/vmlinuz
initrd_path=/images/pxeboot/initrd.img
append=ip=dhcp inst.stage2=http://192.168.1.100/rocky
archives_needed=Packages/,BaseOS/

# ------------------------------------
# Ubuntu Config
# ------------------------------------
[ubuntu]
label=Install Ubuntu
iso_url=https://releases.ubuntu.com/20.04/ubuntu-20.04.iso
iso_name=ubuntu-20.04.iso
kernel_path=/casper/vmlinuz
initrd_path=/casper/initrd
append=ip=dhcp
archives_needed=casper/

